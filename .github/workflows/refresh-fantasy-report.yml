name: Refresh fantasy report

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write

concurrency:
  group: fantasy-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-forecast.txt
            requirements-espn.txt
      - name: Select today's Eastern date
        id: target
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print('date=' + datetime.now(ZoneInfo('America/New_York')).date().isoformat())
          PY
      - name: Install forecast and report dependencies
        run: python -m pip install -r requirements-forecast.txt -r requirements-espn.txt
      - name: Create run-specific private workspace
        run: mkdir -p "$RUNNER_TEMP/rink-lab-fantasy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Issue and validate today's NHL forecast
        shell: bash
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_SEASON_ID: ${{ secrets.ESPN_SEASON_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          set -euo pipefail
          private_temp="$RUNNER_TEMP/rink-lab-fantasy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! python scripts/issue_daily_forecasts.py \
            --date "${{ steps.target.outputs.date }}" \
            --template-forecast outputs/per_game_forecast/daily_model_template_2026-11-18 \
            --skip-team-context \
            >"$private_temp/forecast-issue.log" 2>&1; then
            python - "$private_temp/forecast-issue.log" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          frames = re.findall(r'File "([^\"]+)", line (\d+)', log)
          last = next((line.strip() for line in reversed(log.splitlines()) if line.strip()), '')
          match = re.search(r'([A-Za-z_][A-Za-z0-9]*(?:Error|Exception))', last)
          stage_match = re.search(r'Forecast subprocess failed: ([A-Za-z0-9_.-]+\.py) \(exit code \d+; ([A-Za-z_][A-Za-z0-9]*)\)', log)
          location = 'unknown source line'
          for path, line in reversed(frames):
              name = pathlib.Path(path).name
              location = f'{name}:{line}'
              break
          kind = match.group(1) if match else 'ForecastIssueError'
          stage = f' in {stage_match.group(1)} ({stage_match.group(2)})' if stage_match else ''
          print(f'::error::NHL forecast issue failed{stage} ({kind} at {location}); source and ESPN details were suppressed.')
          PY
            exit 1
          fi
          python - "$private_temp/forecast-issue.log" "$GITHUB_ENV" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          bundles = [line.split('Issued bundle:', 1)[1].strip()
                     for line in log.splitlines() if line.startswith('Issued bundle:')]
          if len(bundles) != 1 or not pathlib.Path(bundles[0], 'manifest.json').is_file():
              raise SystemExit('Daily forecast issuer did not produce exactly one bundle')
          with pathlib.Path(sys.argv[2]).open('a') as env:
              env.write(f'FORECAST_BUNDLE={bundles[0]}\n')
          PY
      - name: Validate today's NHL forecast
        shell: bash
        run: |
          set -euo pipefail
          private_temp="$RUNNER_TEMP/rink-lab-fantasy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! python scripts/validate_daily_bundle.py --bundle "$FORECAST_BUNDLE" \
            >"$private_temp/forecast-validation.log" 2>&1; then
            echo "::error::Today's NHL forecast failed release validation; detailed logs were suppressed."
            exit 1
          fi
      - name: Refresh private ESPN rules and future roster
        shell: bash
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_SEASON_ID: ${{ secrets.ESPN_SEASON_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          set -euo pipefail
          private_temp="$RUNNER_TEMP/rink-lab-fantasy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! python scripts/acquire_fantasy_rules.py >"$private_temp/espn-rules.log" 2>&1; then
            echo "::error::ESPN rules refresh failed; private league details were suppressed from public logs."
            exit 1
          fi
          if ! python scripts/acquire_future_roster.py >"$private_temp/espn-future-roster.log" 2>&1; then
            echo "::error::Next-period roster refresh failed; private response details were suppressed from public logs."
            exit 1
          fi
          python - "$GITHUB_ENV" "$ESPN_SEASON_ID" <<'PY'
          import json, os, pathlib, sys
          env_file, season = pathlib.Path(sys.argv[1]), sys.argv[2]
          root = pathlib.Path('data/raw/espn/snapshots')
          def latest(pattern):
              candidates = list(root.glob(pattern))
              if not candidates:
                  raise SystemExit('Required ESPN snapshot is missing')
              return max(candidates, key=lambda p: p.stat().st_mtime)
          snapshot = latest(f'espn_{season}_*')
          rules = latest('rules_*')
          future = latest('future_roster_*')
          metadata = json.loads((snapshot / 'metadata.json').read_text())
          if metadata.get('available_limit_reached'):
              raise SystemExit('ESPN available-player result hit its configured limit; refusing an incomplete streamer report.')
          with env_file.open('a') as f:
              f.write(f'ESPN_SNAPSHOT={snapshot}\n')
              f.write(f'ESPN_RULES={rules}\n')
              f.write(f'ESPN_FUTURE_ROSTER={future}\n')
          PY
      - name: Build current fantasy report
        shell: bash
        run: |
          set -euo pipefail
          private_temp="$RUNNER_TEMP/rink-lab-fantasy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! python scripts/build_today_report.py \
            --bundle "$FORECAST_BUNDLE" \
            --rules "$ESPN_RULES" \
            --future-roster "$ESPN_FUTURE_ROSTER" \
            --espn-snapshot "$ESPN_SNAPSHOT" \
            --team-id "$(python -c 'import json; print(json.load(open("config/fantasy_report.json"))["team_id"])')" \
            --out "reports/today/${{ steps.target.outputs.date }}_github_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            >"$private_temp/private-report-build.log" 2>&1; then
            python - "$private_temp/private-report-build.log" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          frames = re.findall(r'File "([^"]+)", line (\d+)', log)
          last = next((line.strip() for line in reversed(log.splitlines()) if line.strip()), '')
          error_match = re.match(r'(?:[A-Za-z_][A-Za-z0-9_]*\.)*([A-Za-z_][A-Za-z0-9]*(?:Error|Exception))(?:[:(]|\b)', last)
          error_types = re.findall(r'(?m)^\s*([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception))(?=:|\b)', log)
          coverage = re.search(r'Fantasy forecast coverage: skaters \d+/\d+; goalies \d+/\d+; NHL identity source (?:present|missing)', log)
          location = 'unknown source line'
          for path, line in reversed(frames):
              try:
                  location = f'{pathlib.Path(path).resolve().relative_to(pathlib.Path.cwd().resolve())}:{line}'
                  break
              except ValueError:
                  continue
          if location == 'unknown source line' and frames:
              path, line = frames[-1]
              location = f'{pathlib.Path(path).name}:{line}'
          kind = (error_types[-1].rsplit('.', 1)[-1] if error_types else
                  error_match.group(1) if error_match else 'UnknownError')
          if coverage:
              print(f'::error::{coverage.group(0)}. Check the NHL identity source and roster forecast matches before publishing.')
          print(f'::error::Fantasy report build failed ({kind} at {location}); private details were suppressed.')
          PY
            exit 1
          fi
          python - "$private_temp/private-report-build.log" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          coverage = re.search(r'Fantasy forecast coverage: skaters \d+/\d+; goalies \d+/\d+; NHL identity source (?:present|missing)', log)
          if not coverage:
              raise SystemExit('Fantasy forecast coverage summary missing; refusing publication.')
          print(coverage.group(0))
          PY
      - name: Export and verify the public report fields
        shell: bash
        run: |
          set -euo pipefail
          private_temp="$RUNNER_TEMP/rink-lab-fantasy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report=$(find reports/today -mindepth 1 -maxdepth 1 -type d -name "${{ steps.target.outputs.date }}_github_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" -print -quit)
          public_report="$private_temp/public-report"
          python scripts/prepare_github_report.py --report "$report" --out "$public_report"
          python - "$public_report" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / 'manifest.json').read_text())
          for name, expected in manifest['files'].items():
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Public report hash check failed: ' + name)
          forbidden = {'espn_player_id', 'fantasy_team_id', 'espn_s2', 'swid', 'league_id'}
          data = json.loads((root / 'report.json').read_text())
          def keys(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      yield key
                      yield from keys(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from keys(item)
          if forbidden.intersection(keys(data)):
              raise SystemExit('Private identifier found in public fantasy report')
          for path in root.iterdir():
              if path.is_file():
                  payload = path.read_bytes()
                  if any(secret in payload for secret in (b'data/raw/espn', b'/home/runner/work', b'/Users/')):
                      raise SystemExit('Private filesystem path found in public fantasy report')
          PY
      - name: Publish sanitized report to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          public_report="$RUNNER_TEMP/rink-lab-fantasy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/public-report"
          cp -R "$public_report/." docs/report/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report
          if git diff --cached --quiet; then
            echo "The sanitized fantasy report is already current."
            exit 0
          fi
          git commit -m "Refresh fantasy report for ${{ steps.target.outputs.date }}"
          git push origin HEAD:main
          echo "Published the sanitized fantasy report for ${{ steps.target.outputs.date }}."
